name: Publish to npm and MCP Registry

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to npm and MCP Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance AND MCP Registry OIDC auth

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verify package.json has mcpName
        run: |
          # Guards against accidental removal of the MCP Registry namespace
          # declaration. Without this field, the registry publish step would
          # fail with a confusing OIDC verification error after npm publish
          # has already shipped the release.
          if ! grep -q '"mcpName"' package.json; then
            echo "package.json is missing the mcpName field" >&2
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install mcp-publisher
        timeout-minutes: 5
        # Pinned version + SHA-256 of the linux_amd64 tarball.
        # Bump both together when upgrading mcp-publisher.
        run: |
          VERSION=v1.5.0
          EXPECTED_SHA=79bbb73ba048c5906034f73ef6286d7763bd53cf368ea0b358fc593ed360cbd5
          TARBALL=mcp-publisher_linux_amd64.tar.gz
          curl -fsSL -O "https://github.com/modelcontextprotocol/registry/releases/download/${VERSION}/${TARBALL}"
          echo "${EXPECTED_SHA}  ${TARBALL}" | sha256sum -c -
          sudo tar -xzf "${TARBALL}" -C /usr/local/bin mcp-publisher
          mcp-publisher --version

      - name: Authenticate with MCP Registry
        timeout-minutes: 5
        run: mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        timeout-minutes: 5
        run: mcp-publisher publish
